<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>観光特急 3D WebVR Walkthrough ドクターイエロー並走版</title>
  <!-- A-Frame 1.4.2 Library -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
  <!-- Tailwind CSS for UI HUD -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Inter:wght@400;600;700&display=swap');
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Shippori Mincho', 'Inter', serif;
      background-color: #050404;
      user-select: none;
    }

    a-scene {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .garaku-gold-text {
      color: #d4af37;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .garaku-maroon-bg {
      background-color: rgba(50, 8, 14, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .garaku-btn {
      background: linear-gradient(135deg, #2b110a 0%, #4a1e12 100%);
      border: 1px solid #d4af37;
      color: #f3e5ab;
      transition: all 0.2s ease;
    }

    .garaku-btn:hover, .garaku-btn.active {
      background: linear-gradient(135deg, #800020 0%, #b31238 100%);
      border-color: #fff;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- Top UI Overlay: Title & Car Switcher -->
  <div class="fixed top-0 left-0 right-0 z-50 p-3 pointer-events-none flex flex-col md:flex-row justify-between items-center gap-3">
    <!-- Brand Header -->
    <div class="garaku-maroon-bg p-2.5 px-5 rounded-2xl pointer-events-auto flex items-center gap-3 shadow-2xl">
      <div class="w-9 h-9 rounded-full border-2 border-yellow-500 flex items-center justify-center bg-red-950 font-bold text-yellow-400 text-lg">
        雅
      </div>
      <div>
        <h1 class="text-lg md:text-xl font-bold tracking-wider text-amber-100">
          観光特急
        </h1>
        <p class="text-[11px] text-amber-200/70 font-sans">3D WebVR (夕焼けグラデーション・ドクターイエロー並走)</p>
      </div>
    </div>

    <!-- Quick Car Teleport Bar -->
    <div class="garaku-maroon-bg p-1.5 rounded-2xl pointer-events-auto flex flex-wrap justify-center gap-1 shadow-2xl">
      <button onclick="teleportToCar(1)" id="btn-car-1" class="garaku-btn active px-3 py-1 rounded-xl text-xs font-semibold flex items-center gap-1">
        1号車 <span class="opacity-75 text-[10px] hidden sm:inline">(秋/楓)</span>
      </button>
      <button onclick="teleportToCar(2)" id="btn-car-2" class="garaku-btn px-3 py-1 rounded-xl text-xs font-semibold flex items-center gap-1">
        2号車 <span class="opacity-75 text-[10px] hidden sm:inline">(冬/坪庭)</span>
      </button>
      <button onclick="teleportToCar(3)" id="btn-car-3" class="garaku-btn px-3 py-1 rounded-xl text-xs font-semibold flex items-center gap-1">
        3号車 <span class="opacity-75 text-[10px] hidden sm:inline">(春/桜カウンター)</span>
      </button>
      <button onclick="teleportToCar(4)" id="btn-car-4" class="garaku-btn px-3 py-1 rounded-xl text-xs font-semibold flex items-center gap-1">
        4号車 <span class="opacity-75 text-[10px] hidden sm:inline">(夏/葵)</span>
      </button>
      <button onclick="teleportToCar(5)" id="btn-car-5" class="garaku-btn px-3 py-1 rounded-xl text-xs font-semibold flex items-center gap-1">
        5号車 <span class="opacity-75 text-[10px] hidden sm:inline">(初秋/ススキ坪庭)</span>
      </button>
      <button onclick="teleportToCar(6)" id="btn-car-6" class="garaku-btn px-3 py-1 rounded-xl text-xs font-semibold flex items-center gap-1">
        6号車 <span class="opacity-75 text-[10px] hidden sm:inline">(早春/梅)</span>
      </button>
    </div>
  </div>

  <!-- Bottom Left Info HUD & Cab Control Panel -->
  <div class="fixed bottom-4 left-4 z-50 pointer-events-none flex flex-col gap-2 max-w-sm w-full">
    <!-- Cab Controls (Visible only in Cab View) -->
    <div id="cab-control-panel" class="garaku-maroon-bg p-3 rounded-2xl pointer-events-auto shadow-2xl hidden border border-amber-400/60">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-yellow-300">🎮 マスコン・ブレーキ操作（前面展望）</span>
        <span class="text-[10px] text-amber-200/80">速度: <strong id="speed-display" class="text-white text-sm">60</strong> km/h</span>
      </div>
      <div class="grid grid-cols-4 gap-1.5 mb-2">
        <button onclick="setTargetSpeed(-15)" class="garaku-btn py-1 rounded text-[11px] font-bold">制動 (B)</button>
        <button onclick="setTargetSpeed(0)" class="garaku-btn py-1 rounded text-[11px] font-bold bg-neutral-800">N (0)</button>
        <button onclick="setTargetSpeed(45)" class="garaku-btn py-1 rounded text-[11px] font-bold">P1 (45)</button>
        <button onclick="setTargetSpeed(85)" class="garaku-btn py-1 rounded text-[11px] font-bold bg-red-950">P2 (85)</button>
      </div>
    </div>

    <!-- Car Info Card -->
    <div id="car-info-card" class="garaku-maroon-bg p-4 rounded-2xl pointer-events-auto shadow-2xl">
      <div class="flex items-center justify-between border-b border-amber-500/30 pb-2 mb-2">
        <span id="info-car-title" class="garaku-gold-text text-base md:text-lg font-bold">1号車：秋（楓 - かえで）</span>
        <span id="info-car-type" class="text-[11px] bg-amber-500/20 text-amber-200 px-2 py-0.5 rounded border border-amber-500/40">畳ボックス座席</span>
      </div>
      <p id="info-car-desc" class="text-xs text-amber-100/90 leading-relaxed font-sans mb-2">
        楓文様を散りばめた秋の装い。畳座席を備えた対面クロスシートと和風テーブルで京都町家のようなぬくもりある空間。
      </p>
      <div class="flex justify-between items-center text-[10px] text-amber-300/70 font-sans border-t border-amber-500/20 pt-2">
        <span>区間：上牧〜大山崎（ドクターイエロー・新幹線 並走高架）</span>
      </div>
    </div>
  </div>

  <!-- Bottom Right Controls -->
  <div class="fixed bottom-4 right-4 z-50 pointer-events-none flex flex-wrap gap-2 justify-end">
    <!-- Chime Button -->
    <button onclick="playHankyuChime()" class="garaku-maroon-bg pointer-events-auto px-3 py-2 rounded-xl text-xs text-yellow-300 border border-yellow-500/60 hover:border-yellow-300 flex items-center gap-1.5 shadow-xl">
      <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"></path></svg>
      車内チャイム 🔔
    </button>
    <!-- View Mode Toggle -->
    <button onclick="toggleCabView()" id="cab-view-btn" class="garaku-maroon-bg pointer-events-auto px-3 py-2 rounded-xl text-xs text-amber-200 border border-amber-500/40 hover:border-amber-300 flex items-center gap-1.5 shadow-xl">
      <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
      視点：<span id="view-mode-label">客室ウォークスルー</span>
    </button>
    <!-- Weather Toggle -->
    <button onclick="toggleWeather()" id="weather-btn" class="garaku-maroon-bg pointer-events-auto px-3 py-2 rounded-xl text-xs text-amber-200 border border-amber-500/40 hover:border-amber-300 flex items-center gap-1.5 shadow-xl">
      <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
      天候：<span id="weather-mode-label">晴れ</span>
    </button>
    <!-- Sound Toggle -->
    <button onclick="toggleTrainSound()" id="sound-btn" class="garaku-maroon-bg pointer-events-auto px-3 py-2 rounded-xl text-xs text-amber-200 border border-amber-500/40 hover:border-amber-300 flex items-center gap-1.5 shadow-xl">
      <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
      走行音：<span id="sound-mode-label">OFF</span>
    </button>
    <!-- Lighting Toggle -->
    <button onclick="toggleTimeOfDay()" class="garaku-maroon-bg pointer-events-auto px-3 py-2 rounded-xl text-xs text-amber-200 border border-amber-500/40 hover:border-amber-300 flex items-center gap-1.5 shadow-xl">
      <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      照明：<span id="light-mode-label">昼間</span>
    </button>
    <!-- Reset Camera -->
    <button onclick="resetCamera()" class="garaku-maroon-bg pointer-events-auto px-3 py-2 rounded-xl text-xs text-amber-200 border border-amber-500/40 hover:border-amber-300 flex items-center gap-1.5 shadow-xl">
      <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      リセット
    </button>
  </div>

  <!-- A-Frame 3D Scene -->
  <a-scene embedded renderer="antialias: true; colorManagement: true;" background="color: #121015">
    
    <a-entity id="scene-ambient" light="type: ambient; color: #fff3e0; intensity: 1.15;"></a-entity>
    <a-entity id="scene-sun" light="type: directional; color: #ffebd2; intensity: 0.9" position="20 35 15"></a-entity>

    <!-- Player / Camera Rig -->
    <a-entity id="rig" position="0 0.1 0" move-controls>
      <a-camera id="camera" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 14" camera="far: 1000; near: 0.05">
        <a-cursor raycaster="objects: .clickable" color="#d4af37" opacity="0.5" scale="0.6 0.6 0.6"></a-cursor>
      </a-camera>
    </a-entity>

    <a-sky id="sky" color="#87ceeb"></a-sky>
    <a-entity id="sunset-gradient-dome"></a-entity>
    <a-entity id="cloud-container"></a-entity>

    <!-- 下界の河川敷 -->
    <a-plane position="0 -8.5 -160" rotation="-90 0 0" width="400" height="450" color="#4d7c0f" material="roughness: 0.95"></a-plane>
    <a-plane position="48 -8.4 -160" rotation="-90 0 0" width="45" height="450" color="#0284c7" material="roughness: 0.2; metalness: 0.4"></a-plane>

    <!-- 京都線 高架橋 -->
    <a-box position="1.9 -0.35 -160" width="8.6" height="0.4" depth="420" color="#cbd5e1"></a-box>
    <a-box position="1.9 -0.13 -160" width="8.0" height="0.06" depth="420" color="#475569"></a-box>
    <a-box position="-2.35 0.45 -160" width="0.25" height="1.2" depth="420" color="#94a3b8"></a-box>
    <a-box position="6.15 0.45 -160" width="0.25" height="1.2" depth="420" color="#94a3b8"></a-box>

    <!-- 自線レール -->
    <a-box position="-0.72 -0.05 -160" width="0.08" height="0.12" depth="420" color="#cbd5e1" material="metalness: 0.8; roughness: 0.3"></a-box>
    <a-box position="0.72 -0.05 -160" width="0.08" height="0.12" depth="420" color="#cbd5e1" material="metalness: 0.8; roughness: 0.3"></a-box>
    <a-box position="0 3.8 -160" width="0.025" height="0.025" depth="420" color="#334155"></a-box>

    <!-- 対面線レール -->
    <a-box position="3.08 -0.05 -160" width="0.08" height="0.12" depth="420" color="#cbd5e1" material="metalness: 0.8; roughness: 0.3"></a-box>
    <a-box position="4.52 -0.05 -160" width="0.08" height="0.12" depth="420" color="#cbd5e1" material="metalness: 0.8; roughness: 0.3"></a-box>
    <a-box position="3.8 3.8 -160" width="0.025" height="0.025" depth="420" color="#334155"></a-box>

    <!-- 東海道新幹線 高架橋（左側） -->
    <a-entity id="shinkansen-viaduct" position="-11.5 0.6 -160">
      <a-box position="0 -0.25 0" width="9.8" height="0.55" depth="420" color="#e2e8f0"></a-box>
      <a-box position="-4.75 0.85 0" width="0.28" height="1.85" depth="420" color="#cbd5e1"></a-box>
      <a-box position="4.75 0.85 0" width="0.28" height="1.85" depth="420" color="#cbd5e1"></a-box>
      <a-box position="4.75 1.78 0" width="0.34" height="0.08" depth="420" color="#94a3b8"></a-box>
      <a-box position="-2.6 0.08 0" width="0.08" height="0.12" depth="420" color="#94a3b8"></a-box>
      <a-box position="-1.1 0.08 0" width="0.08" height="0.12" depth="420" color="#94a3b8"></a-box>
      <a-box position="1.1 0.08 0" width="0.08" height="0.12" depth="420" color="#94a3b8"></a-box>
      <a-box position="2.6 0.08 0" width="0.08" height="0.12" depth="420" color="#94a3b8"></a-box>
      <a-box position="-1.85 4.2 0" width="0.03" height="0.03" depth="420" color="#475569"></a-box>
      <a-box position="1.85 4.2 0" width="0.03" height="0.03" depth="420" color="#475569"></a-box>
    </a-entity>

    <!-- 手前側（x = -9.65）にドクターイエロー、奥側（x = -13.35）にN700系新幹線を配置 -->
    <a-entity id="doctor-yellow-train" position="-9.65 0.65 -140"></a-entity>
    <a-entity id="shinkansen-train-down" position="-13.35 0.65 80"></a-entity>

    <a-entity id="scenery-left" position="-42 8 -160">
      <a-box width="1.5" height="36" depth="420" color="#3a5a40" material="roughness: 0.95"></a-box>
      <a-box position="8 -4 0" width="1.2" height="22" depth="420" color="#588157" material="roughness: 0.9"></a-box>
    </a-entity>
    <a-entity id="scenery-right" position="75 4 -160">
      <a-box width="1.5" height="24" depth="420" color="#4d7c0f" material="roughness: 0.9"></a-box>
    </a-entity>

    <a-entity id="scenery-posts"></a-entity>
    <a-entity id="shinkansen-posts"></a-entity>
    <a-entity id="railway-ties"></a-entity>
    
    <a-entity id="station-platform" position="-2.3 0 -220">
      <a-box position="0 0.45 0" width="1.8" height="0.9" depth="45" color="#94a3b8"></a-box>
      <a-box position="0 0.91 0" width="1.75" height="0.02" depth="44.8" color="#cbd5e1"></a-box>
      <a-box position="0.72 0.92 0" width="0.14" height="0.02" depth="44.8" color="#eab308"></a-box>
      <a-box position="0 2.4 0" width="1.8" height="0.1" depth="42" color="#334155"></a-box>
      <a-cylinder position="0.4 1.6 -16" radius="0.07" height="1.6" color="#475569"></a-cylinder>
      <a-cylinder position="0.4 1.6 0" radius="0.07" height="1.6" color="#475569"></a-cylinder>
      <a-cylinder position="0.4 1.6 16" radius="0.07" height="1.6" color="#475569"></a-cylinder>
      <a-box position="0.65 2.05 0" width="0.05" height="0.48" depth="1.8" color="#ffffff"></a-box>
      <a-box position="0.65 2.05 0" width="0.06" height="0.1" depth="1.8" color="#800020"></a-box>
    </a-entity>

    <a-entity id="weather-particles"></a-entity>

    <!-- Front Driver Cab -->
    <a-entity id="driver-cab" position="0 0 -119.0">
      <a-plane position="0 0.01 0" rotation="-90 0 0" width="3.1" height="1.6" color="#1e293b"></a-plane>
      <a-box position="-1.52 1.38 0" width="0.1" height="2.74" depth="1.6" color="#24140b"></a-box>
      <a-box position="1.52 1.38 0" width="0.1" height="2.74" depth="1.6" color="#24140b"></a-box>
      <a-plane position="0 2.75 0" rotation="90 0 0" width="3.1" height="1.6" color="#24140b"></a-plane>
      <a-box position="0 0.45 -0.78" width="3.1" height="0.9" depth="0.15" color="#24140b"></a-box>
      <a-box position="-1.45 1.8 -0.78" width="0.2" height="1.8" depth="0.15" color="#24140b"></a-box>
      <a-box position="-0.08 1.8 -0.78" width="0.08" height="1.8" depth="0.15" color="#24140b"></a-box>
      <a-box position="1.45 1.8 -0.78" width="0.2" height="1.8" depth="0.15" color="#24140b"></a-box>
      <a-box position="0 2.58 -0.78" width="3.1" height="0.3" depth="0.15" color="#24140b"></a-box>
      <a-plane position="0 1.65 -0.76" width="2.8" height="1.55" color="#e0f2fe" material="opacity: 0.08; transparent: true"></a-plane>
      <a-box position="-0.75 1.15 -0.82" width="0.02" height="0.55" depth="0.02" rotation="0 0 -18" color="#111"></a-box>
      <a-box position="0.65 1.15 -0.82" width="0.02" height="0.55" depth="0.02" rotation="0 0 -18" color="#111"></a-box>
      <a-box position="-0.75 0.92 -0.45" width="1.25" height="0.14" depth="0.52" color="#1e293b"></a-box>
      <a-box position="-0.75 1.00 -0.45" width="1.20" height="0.02" depth="0.48" color="#0f172a"></a-box>
      <a-cylinder position="-0.92 1.02 -0.42" radius="0.085" height="0.02" rotation="-20 0 0" color="#111"></a-cylinder>
      <a-cylinder position="-0.92 1.022 -0.42" radius="0.07" height="0.02" rotation="-20 0 0" color="#fef08a" material="emissive: #eab308; emissiveIntensity: 0.7"></a-cylinder>
      <a-box position="-0.62 1.02 -0.42" width="0.24" height="0.02" depth="0.15" rotation="-20 0 0" color="#0284c7" material="emissive: #38bdf8; emissiveIntensity: 0.75"></a-box>
      <a-box position="-1.12 1.08 -0.35" width="0.05" height="0.16" depth="0.05" color="#475569"></a-box>
      <a-box position="-1.12 1.16 -0.35" width="0.20" height="0.035" depth="0.05" color="#800020"></a-box>
      <a-box position="-0.38 1.08 -0.35" width="0.05" height="0.16" depth="0.05" color="#475569"></a-box>
      <a-cylinder position="-0.38 1.16 -0.35" radius="0.075" height="0.025" color="#d4af37"></a-cylinder>
      <a-box position="0.75 0.90 -0.48" width="1.25" height="0.10" depth="0.45" color="#29170e"></a-box>
      <a-box position="0.75 0.95 -0.48" width="1.25" height="0.02" depth="0.46" color="#d4af37"></a-box>
    </a-entity>

    <a-entity id="train-cars-container"></a-entity>

  </a-scene>

  <!-- Simulation Logic -->
  <script>
    const carData = {
      1: { name: "1号車：秋（楓 - かえで）", type: "畳ボックス座席", desc: "楓文様を散りばめた秋の装い。畳座席を備えた対面クロスシートと和風テーブルで京都町家のようなぬくもりある空間。", pos: { x: 0, y: 0.1, z: 0 }, zOffset: 0, floorColor: "#3d2617", wallColor: "#24140b", lightColor: "#ffdfa9", emissiveColor: "#ffe0b2", layout: "box_autumn" },
      2: { name: "2号車：冬（竹 - たけ）", type: "坪庭＆丸窓・畳ベンチ", desc: "車内に本格的な枯山水「坪庭（つぼにわ）」と障子風「円窓（丸窓）」を設けた雅洛の象徴的車両。冬の静寂と竹林を表現。", pos: { x: 0, y: 0.1, z: -22 }, zOffset: -22, floorColor: "#2d2018", wallColor: "#1f130c", lightColor: "#ffe4b8", emissiveColor: "#ffe4b8", layout: "tsuboniwa_winter" },

    // 923形 ドクターイエロー（7両編成・検測ドーム＆ライト付き）生成関数
    function buildDoctorYellowModel(containerId, isUpbound) {
      const container = document.getElementById(containerId);
      const carCount = 7; // ドクターイエローは7両編成
      const carLen = 14.5;
      const bodyYellow = "#facc15"; // 鮮やかな新幹線イエロー
      const stripeBlue = "#0369a1"; // 濃紺・ブルーの帯
      let html = '';

      for (let i = 0; i < carCount; i++) {
        const z = isUpbound ? (i * (carLen + 0.3)) : -(i * (carLen + 0.3));
        const isFront = (i === 0);
        const isRear = (i === carCount - 1);
        // 2号車・6号車付近のパンタグラフ検測投光器（ライトアップ）と4号車観測ドームを再現
        const hasObservationDome = (i === 3);
        const hasInspectionLight = (i === 1 || i === 5);

        if (isFront || isRear) {
          const dir = (isUpbound && isFront) || (!isUpbound && isRear) ? -1 : 1;
          html += `
            <a-entity position="0 0 ${z}">
              <!-- 車体本体（イエロー） -->
              <a-box position="0 1.45 ${-dir * 2.2}" width="2.95" height="2.4" depth="10.0" color="${bodyYellow}"></a-box>
              <!-- ブルー帯 -->
              <a-box position="0 0.72 ${-dir * 2.2}" width="2.99" height="0.24" depth="10.0" color="${stripeBlue}"></a-box>
              <a-box position="0 1.25 ${-dir * 2.2}" width="2.99" height="0.07" depth="10.0" color="${stripeBlue}"></a-box>
              <!-- 700系ベース流線形ノーズ -->
              <a-box position="0 1.05 ${dir * 4.2}" width="2.7" height="1.5" depth="3.8" rotation="${dir * 12} 0 0" color="${bodyYellow}"></a-box>
              <a-cone position="0 0.75 ${dir * 6.8}" radius-bottom="1.25" radius-top="0.25" height="3.2" rotation="${dir * 86} 0 0" color="${bodyYellow}"></a-cone>
              <a-box position="0 0.65 ${dir * 4.5}" width="2.76" height="0.20" depth="4.2" color="${stripeBlue}"></a-box>
              <!-- 運転席ガラス＆前方軌道確認カメラ窓 -->
              <a-box position="0 1.72 ${dir * 3.2}" width="1.9" height="0.55" depth="1.4" rotation="${dir * 28} 0 0" color="#0f172a"></a-box>
              <!-- ヘッドライト / テールライト -->
              <a-box position="-0.85 1.15 ${dir * 5.2}" width="0.35" height="0.14" depth="0.2" color="${isFront ? '#ffffff' : '#ef4444'}" material="emissive: ${isFront ? '#fef08a' : '#dc2626'}; emissiveIntensity: 1.2"></a-box>
              <a-box position="0.85 1.15 ${dir * 5.2}" width="0.35" height="0.14" depth="0.2" color="${isFront ? '#ffffff' : '#ef4444'}" material="emissive: ${isFront ? '#fef08a' : '#dc2626'}; emissiveIntensity: 1.2"></a-box>
            </a-entity>
          `;
        } else {
          html += `
            <a-entity position="0 0 ${z}">
              <!-- 中間車（イエロー） -->
              <a-box position="0 1.45 0" width="2.95" height="2.4" depth="${carLen}" color="${bodyYellow}"></a-box>
              <!-- ブルー帯 -->
              <a-box position="0 0.72 0" width="2.99" height="0.24" depth="${carLen}" color="${stripeBlue}"></a-box>
              <a-box position="0 1.25 0" width="2.99" height="0.07" depth="${carLen}" color="${stripeBlue}"></a-box>

      }

      rig.setAttribute('position', `${target.pos.x} ${target.pos.y} ${target.pos.z}`);

    function setTargetSpeed(val) {
      if (val === -15) {
        targetSpeed = Math.max(0, targetSpeed - 20);
      } else {
        targetSpeed = val;
      }
    }

    function updatePhysics(delta) {
      const accelerationRate = 12.0;
      if (currentSpeed < targetSpeed) {
        currentSpeed = Math.min(targetSpeed, currentSpeed + accelerationRate * delta);
      } else if (currentSpeed > targetSpeed) {
        currentSpeed = Math.max(targetSpeed, currentSpeed - (accelerationRate * 1.5) * delta);
      }
      document.getElementById('speed-display').innerText = Math.round(currentSpeed);
    }

    let swayTime = 0;
    function updateStraps(delta) {
      if (currentSpeed <= 0.5) return;
      swayTime += delta * (1.8 + currentSpeed * 0.03);
      const maxAngle = Math.min(9.0, (currentSpeed / 85) * 7.5);
      strapElements.forEach(item => {
        const angleZ = Math.sin(swayTime + item.phase) * maxAngle;
        const angleX = Math.cos(swayTime * 0.8 + item.phase) * (maxAngle * 0.35);
        item.el.setAttribute('rotation', `${angleX} 0 ${angleZ}`);
      });
    }

    function playHankyuChime() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const notes = [523.25, 659.25, 783.99, 1046.50];
      const now = audioCtx.currentTime;

      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + index * 0.15);

        gain.gain.setValueAtTime(0, now + index * 0.15);
        gain.gain.linearRampToValueAtTime(0.25, now + index * 0.15 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.15 + 0.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + index * 0.15);
        osc.stop(now + index * 0.15 + 0.8);
      });
    }

    let audioCtx = null;
    let isSoundPlaying = false;
    let jointIntervalTimer = null;

    function toggleTrainSound() {
      const label = document.getElementById('sound-mode-label');
      if (!isSoundPlaying) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        startTrainSound(audioCtx);
        isSoundPlaying = true;
        label.innerText = 'ON';
        document.getElementById('sound-btn').classList.add('active');
      } else {
        stopTrainSound();
        isSoundPlaying = false;
        label.innerText = 'OFF';
        document.getElementById('sound-btn').classList.remove('active');
      }
    }

    function startTrainSound(ctx) {
      const bufferSize = ctx.sampleRate * 2;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

      const whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 320;

      const gainNode = ctx.createGain();
      gainNode.gain.value = 0.12;

      whiteNoise.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(ctx.destination);
      whiteNoise.start();
      window._trainNoise = whiteNoise;

      scheduleJointSound(ctx);
    }

    function scheduleJointSound(ctx) {
      if (!isSoundPlaying) return;
      if (currentSpeed > 2) {
        playJointSound(ctx);
        const interval = Math.max(90, 320 * (60 / currentSpeed));
        jointIntervalTimer = setTimeout(() => scheduleJointSound(ctx), interval);
      } else {
        jointIntervalTimer = setTimeout(() => scheduleJointSound(ctx), 300);
      }
    }

    function playJointSound(ctx) {
      if (currentSpeed <= 2) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(85, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.07);
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.07);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.07);
    }

    function stopTrainSound() {
      if (window._trainNoise) {
        window._trainNoise.stop();
        window._trainNoise.disconnect();
        window._trainNoise = null;
      }
      if (jointIntervalTimer) {
        clearTimeout(jointIntervalTimer);
        jointIntervalTimer = null;
      }
    }

    let lastTime = performance.now();
    function animationLoop(time) {
      const delta = (time - lastTime) / 1000;
      lastTime = time;

      updatePhysics(delta);
      updateScenery(delta);
      updateWeather(delta);
      updateStraps(delta);

      requestAnimationFrame(animationLoop);
    }

    window.addEventListener('load', () => {
      buildAllCars();
      buildDoctorYellowModel('doctor-yellow-train', true);
      buildShinkansenModel('shinkansen-train-down', false);
      initScenery();
      requestAnimationFrame(animationLoop);

      const rig = document.getElementById('rig');
      setInterval(() => {
        if (!rig || isCabView) return;
        const zPos = rig.getAttribute('position').z;

        let detectedCar = 1;
        if (zPos > -11) detectedCar = 1;
        else if (zPos > -33) detectedCar = 2;
        else if (zPos > -55) detectedCar = 3;
        else if (zPos > -77) detectedCar = 4;
        else if (zPos > -99) detectedCar = 5;
        else detectedCar = 6;

        if (detectedCar !== currentCar) {
          currentCar = detectedCar;
          updateActiveButtons(currentCar);
          updateInfoCard(carData[currentCar]);
        }
      }, 400);
    });
  </script>
</body>
</html>
